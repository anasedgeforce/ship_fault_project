[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-fault-inference"
version = "0.1.0"
description = "Serving boundary for ship simulator vibration fault models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn==1.8.0",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.25",
  "pymongo>=4.15,<5",
  "dnspython>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
training = ["matplotlib>=3.7", "tabulate>=0.9"]

[project.scripts]
ship-fault = "ship_fault.cli:main"

[tool.setuptools.packages.find]
include = ["ship_fault*", "src*"]

[tool.setuptools.package-data]
ship_fault = ["web/*.html", "web/*.css", "web/*.js"]
